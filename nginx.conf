# /etc/nginx/sites-available/tartib — domenni o'zingiznikiga almashtiring.
# Ilova javoblarni o'zi siqadi (brotli/gzip) va kesh sarlavhalarini qo'yadi, nginx faqat proxy qiladi.
upstream tartib {
    server 127.0.0.1:4021;   # .env dagi PORT (GitHub secret APP_PORT)
    keepalive 32;
}

server {
    listen 80;
    server_name ssbot.zamongroup.uz;

    # HTTP → HTTPS redirect
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ssbot.zamongroup.uz;

    ssl_certificate     /etc/letsencrypt/live/ssbot.zamongroup.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ssbot.zamongroup.uz/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    gzip off;                  # javoblar ilovadan siqilgan holda keladi
    client_max_body_size 1m;

    # Mini App + API + Telegram webhook — hammasi bitta Node jarayonida
    location / {
        proxy_pass         http://tartib;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;    # AI so'rovlari 60 s gacha davom etishi mumkin
    }
}
