<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Tartib</title>
<link rel="icon" href="favicon.svg">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://telegram.org">
<!-- the SDK loads in parallel and never blocks the first screen; the app starts without it -->
<script async src="https://telegram.org/js/telegram-web-app.js?59" onload="window.__tgl&&__tgl()"></script>
<script>
// theme before first paint: saved choice, else Telegram's (from the launch URL), else the system's
try{var t=localStorage.getItem('theme'),h=new URLSearchParams(location.hash.slice(1)).get('tgWebAppThemeParams'),d;
if(t==='dark'||t==='light')d=t==='dark';else if(h){var b=JSON.parse(h).bg_color.slice(1);d=(parseInt(b.slice(0,2),16)*.3+parseInt(b.slice(2,4),16)*.59+parseInt(b.slice(4,6),16)*.11)<128}
else d=matchMedia('(prefers-color-scheme: dark)').matches;if(d)document.documentElement.dataset.theme='dark'}catch(e){}
</script>
<style>/*CSS*/</style>
</head>
<body>
<!--SPRITE-->
<div id="app">
  <!-- skeleton: painted before any script runs, replaced by the real screen -->
  <header class="top"><span class="sk" style="width:110px;height:26px"></span><span class="grow"></span><span class="sk" style="width:64px;height:30px;border-radius:99px"></span></header>
  <div class="wrap"><span class="sk" style="width:40%;height:12px;margin-top:14px"></span><span class="sk" style="width:62%;height:36px;margin:10px 0 26px"></span>
    <div class="list"><span class="sk" style="height:80px;border-radius:18px"></span><span class="sk" style="height:80px;border-radius:18px"></span><span class="sk" style="height:80px;border-radius:18px"></span></div></div>
</div>
<div id="toast" hidden></div>
<script>/*CORE*/</script>
</body>
</html>
